name: Build Android test APK

# Runs (a) when you push to the branch harako-final-fixes, using the repository variable APP_URL
# (Settings > Secrets and variables > Actions > Variables), or (b) manually from the Actions tab
# once this file is on the default branch, typing the address by hand.
# The APK is a thin shell that opens the HARAKO web app at that address.
# TEST BUILD: debug-signed, not for the Play Store.
on:
  push:
    branches: [harako-final-fixes]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "Address the app opens, e.g. http://192.168.43.100:3000 (no trailing slash)"
        required: false
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install wrapper dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Write Capacitor config
        working-directory: mobile
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          url = os.environ.get("APP_URL", "").strip().rstrip("/")
          if not url:
              sys.exit("No address: set the repository variable APP_URL or pass app_url.")
          if not (url.startswith("http://") or url.startswith("https://")):
              sys.exit("app_url must start with http:// or https://")
          cfg = {
              "appId": "ir.harako.app",
              "appName": "HARAKO",
              "webDir": "www",
              "server": {"url": url, "cleartext": url.startswith("http://")},
          }
          json.dump(cfg, open("capacitor.config.json", "w"), indent=2)
          print("server url:", url)
          PY

      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Add location permissions
        working-directory: mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' "$M"
          grep -n "uses-permission" "$M"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: harako-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
